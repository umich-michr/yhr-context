document:
  title: YourHealthResearch.org Application Context
  tagline: >
    Functional, architectural, governance, data-model, and support documentation
    for a human-subject research recruitment application.
  purpose:
    - support_questions
    - functional_analysis
    - architecture_analysis
    - data_model_mapping
    - lifecycle_management
    - feature_design
  interpretation:
    confirmed_rules: "01-overview/business-rules.md"
    unresolved_behavior: "09-decisions/open-questions.md"
    terminology: "01-overview/terminology.md"
  interpretation_rules:
    - "Treat business rules as confirmed unless a later approved revision changes them."
    - "Treat recommendations as proposed controls, not existing behavior."
    - "Treat items in the open-question register as unresolved."
    - "Distinguish institutional roles from application roles."
    - "Distinguish imported source-of-truth data from operational application data."
    - "Distinguish historical participant-study relationships from current visibility."
    - "Do not assume a valid institutional login grants access to every study."
    - "Do not assume that an IRB-approved study is necessarily publishable through this recruitment tool."

# Start-here entries appear at the top of llms.txt before the topic sections.
start_here:
  - path: "index.md"
    label: "Documentation home"
    note: "Application summary and topic routing."
  - path: "01-overview/terminology.md"
    label: "Terminology"
    note: "Canonical definitions."
  - path: "01-overview/business-rules.md"
    label: "Business rules"
    note: "Confirmed cross-cutting invariants."
  - path: "09-decisions/open-questions.md"
    label: "Open questions"
    note: "Behavior that is not yet confirmed."

# Topic sections group related pages under a human-readable heading in llms.txt.
# Each section has a heading and one or more topics whose pages are inlined.
# Topics here are references to the keys in the `topics` map below.
sections:
  - heading: "Application purpose or general behavior"
    topics:
      - application_overview

  - heading: "Multi-institution architecture or branded deployments"
    topics:
      - multi_institution_deployment

  - heading: "eResearch, institutional governance, imported data, or CSV uploads"
    topics:
      - institutional_governance
      - eresearch
      - csv_upload

  - heading: "Whether a study may recruit"
    topics:
      - publishability

  - heading: "PI identification, PI changes, or application roles"
    topics:
      - principal_investigator

  - heading: "Creating a study posting"
    topics:
      - study_posting_creation

  - heading: "Participant accounts, profiles, or visibility"
    topics:
      - participant_profile
      - matching

  - heading: "Matching, recommendations, or participant discoverability"
    topics:
      - matching
      - ask_if_interested

  - heading: "Participant interest or screening"
    topics:
      - expression_of_interest
      - questionnaires

  - heading: "Database tables or entity relationships"
    topics:
      - data_model

  - heading: "Support or troubleshooting"
    topics:
      - troubleshooting
      - audit_and_monitoring

