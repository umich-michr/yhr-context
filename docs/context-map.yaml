document:
  title: YourHealthResearch.org Application Context
  tagline: >
    Functional, architectural, governance, data-model, support, and analytics
    documentation for a human-subject research recruitment application.
  purpose:
    - support_questions
    - functional_analysis
    - architecture_analysis
    - data_model_mapping
    - lifecycle_management
    - feature_design
    - study_posting_authoring_analytics
  interpretation:
    confirmed_rules: "01-overview/business-rules.md"
    unresolved_behavior: "09-decisions/open-questions.md"
    study_posting_authoring_analytics_questions: "09-decisions/study-posting-authoring-analytics-open-questions.md"
    terminology: "01-overview/terminology.md"
  interpretation_rules:
    - "Start with the canonical topic page for a narrow question."
    - "Load business-rules.md only for cross-cutting invariants or conflict resolution."
    - "Treat authoritative pages as confirmed current behavior."
    - "Treat recommended content as proposed rather than implemented."
    - "On mixed pages, distinguish confirmed facts from proposed schema or analytics."
    - "Treat open-question pages as unresolved."
    - "Distinguish institutional roles, application-wide roles, and study-association roles."
    - "Distinguish imported governance data from operational application data."
    - "Distinguish active recruitment from historical interested-participant access."
    - "Distinguish relational data from Redis recommendations and generated CSV output."
    - "Do not assume IRB recognition makes a study publishable."

