[project]
name = "yhr-context"
version = "0.1.0"
description = "Application context documentation for YourHealthResearch.org"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.7,<10.0",
    "pymdown-extensions>=11.0.1,<12.0",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pip-audit",
    "pre-commit>=4,<5",
]

[tool.uv]
package = false
default-groups = ["dev"]
